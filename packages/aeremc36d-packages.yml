# (https://sunstore.co/, listed under "## Products / ### SunStore" in https://www.aerem.co/llms.txt),
# and "Aerem Partner App" is Aerem's installer-facing product. No other company named Aerem was
# found publishing to npm. If a later round finds evidence to the contrary, remove these entries
# rather than re-attributing them.
