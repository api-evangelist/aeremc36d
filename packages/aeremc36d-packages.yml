# The Bitbucket workspace AeremTech ("Aerem Tech") is private, so the repo itself cannot be read.
# The link to THIS Aerem — aerem.co, the Mumbai solar FinTech — is established from the published
# README of @aerem/ai-harness, which uses `sunstore-core-service ⎇ feature/partner-dashboard-apis`
