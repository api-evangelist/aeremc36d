aid: aeremc36d
name: Aerem
description: >-
  Aerem is a Mumbai-based "FinTech for CleanTech" group that finances, supplies and monitors
  rooftop solar in India. The group comprises Aerem Solutions Private Limited, NetZero Finance
  Private Limited — an RBI-licensed, solar-focused NBFC — and Sunstore Solar Private Limited.
  Aerem underwrites collateral-free rooftop solar loans for MSMEs and homeowners, provides supply
  chain finance to solar EPC installers, runs the SunStore B2B solar equipment marketplace, and
  operates AeROC, an inverter-agnostic remote monitoring portal for installed plants. It also
  ships two mobile products — the Aerem App for borrowers and the Aerem Partner App for installers
  — and an AAA (Aerem Asset Assurance) quality-certification programme for EPCs. Aerem publishes a
  machine-readable llms.txt and five first-party npm packages, but no public API, developer portal
  or machine-readable API contract of any kind.
