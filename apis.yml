  reason: no-developer-program
  detail: >-
    Aerem ships real software — a Webflow marketing site, Next.js installer and monitoring portals,
    a B2B marketplace and two mobile apps — but exposes none of it to third parties: there is no
    developer portal (https://www.aerem.co/developers returns 404), the provider's own llms.txt
    indexes every public page and lists no API or developer section, /.well-known/ is a blanket
    nginx 403 on all six application hosts, and the only backend that answers anonymously,
    auth.aerem.co, returns the plain string "Server is up and running" with no discovery document.
