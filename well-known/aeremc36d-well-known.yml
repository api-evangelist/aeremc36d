source: live probes of /.well-known/ on every host Aerem is known to operate
summary: 'Nothing is served. All 72 probes (9 named paths x 8 hosts) missed: the two Webflow marketing
  hosts answer 404 with an "Invalid .well-known request" stub, and the six application hosts answer a
  bare nginx 403 Forbidden for the entire /.well-known/ prefix. No security.txt, no api-catalog, no OIDC
  or OAuth discovery, no ai-plugin.json, no A2A agent card, no aauth-resource.'
pointer_basis: NO WellKnown pointer and NO SecurityTxt pointer are emitted in apis.yml. Not one path returned
  a 200 carrying a real document, so a pointer would assert a surface Aerem does not serve. This file
  records a measured absence, which is valid data on its own.
false_positive_watch: The six application hosts return 403 for EVERY /.well-known/* path, including paths
  that do not exist — that is a blanket nginx deny on the prefix, not an access-controlled document. netzerofin.com
  additionally answers HTTP 200 with its SPA shell for arbitrary paths such as /openapi.json and /llms.txt;
  those 200s are soft-404s and are recorded as misses everywhere in this repo.
